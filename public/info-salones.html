<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Información de salones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div id="navbar"></div>

  <div class="container py-5">
    <div class="card shadow-sm p-4">

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h2 class="mb-0">Información de salones</h2>
          <small class="text-muted">Consulta comisiones y cortesías por salón</small>
        </div>

        <span id="user" class="text-muted small"></span>
      </div>

      <!-- Formulario solo admin -->
      <div id="adminForm" class="card mb-4 d-none">
        <div class="card-body">
          <h5 class="mb-3">Agregar / editar información</h5>

          <form id="formInfoSalon">
            <div class="mb-3">
              <label class="form-label">Salón</label>
              <select id="salon_id" class="form-select" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label">Comisión</label>
              <input type="number" id="comision" class="form-control" placeholder="Ejemplo: 500">
            </div>

            <div class="mb-3">
              <label class="form-label">Información</label>
              <textarea id="info" class="form-control" rows="4" placeholder="Ejemplo: 4 fotos 4x6 cortesía"></textarea>
            </div>

            <button class="btn btn-primary" type="submit">
              Guardar información
            </button>
          </form>
        </div>
      </div>

      <!-- Lista tipo acordeón -->
      <div class="accordion" id="accordionSalones"></div>

      <div id="sinDatos" class="alert alert-info d-none mt-3">
        No hay salones registrados.
      </div>

      <br>

      <a class="btn btn-secondary w-100" href="/dashboard.html">
        ⬅ Volver
      </a>

    </div>
  </div>

  <script src="/js/navbar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/info-salones.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
