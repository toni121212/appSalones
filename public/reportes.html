<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reportes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div id="navbar"></div>

  <div class="container py-5">

    <div class="card shadow-sm p-4">
      <h2 class="mb-4">Reportes</h2>

      <div class="row g-3 mb-4">
  <div class="col-md-3">
    <label class="form-label">Salón</label>
    <select class="form-select" id="salon_id"></select>
  </div>

  <div class="col-md-3">
    <label class="form-label">Encargado</label>
    <select class="form-select" id="encargado_id"></select>
  </div>

  <div class="col-md-3">
    <label class="form-label">Desde</label>
    <input class="form-control" id="from" type="date">
  </div>

  <div class="col-md-3">
    <label class="form-label">Hasta</label>
    <input class="form-control" id="to" type="date">
  </div>
</div>

      <button id="buscar" class="btn btn-primary mb-3">Buscar</button>

      <hr>

      <div class="d-flex justify-content-between mb-3">
        <div><b>Total ingresos:</b> $<span id="ti">0.00</span></div>
        <div><b>Total egresos:</b> $<span id="te">0.00</span></div>
        <div><b>Utilidad:</b> $<span id="u">0.00</span></div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
           <tr>
  <th>Fecha</th>
  <th>Salón</th>
    <th>Usuario</th>
  <th class="text-end">Ingresos</th>
  <th class="text-end">Egresos</th>
  <th class="text-end">Utilidad</th>
  <th class="text-center">Acciones</th>
</tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <br>
      <a class="btn btn-secondary w-100" href="/dashboard.html">⬅ Volver</a>
    </div>
  </div>
  <!-- Modal Detalles -->
<div class="modal fade" id="detalleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle del Reporte</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detalleContenido">
      </div>
    </div>
  </div>
</div>
  <script src="/js/navbar.js"></script>
<script src="/js/app.js"></script>
<script src="/js/reportes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
