<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h2 class="mb-0">Dashboard</h2>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span id="user" class="text-muted small"></span>

        <select id="diasTendencia" class="form-select form-select-sm" style="width:auto;">
          <option value="7">Últimos 7 días</option>
          <option value="15">Últimos 15 días</option>
          <option value="30">Últimos 30 días</option>
        </select>

        <button id="btnActualizarDashboard" class="btn btn-sm btn-outline-primary">
          Actualizar
        </button>
      </div>
    </div>

    <!-- Accesos rápidos -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Accesos rápidos</h5>
          <small class="text-muted">Navegación rápida</small>
        </div>

        <div class="row g-2" id="quickActions">
          <!-- Todos -->
          <div class="col-6 col-md-4">
            <a href="/registros.html" class="btn btn-outline-primary w-100 py-3 text-start">
              <div class="fw-semibold">📝 Capturar</div>
              <small class="text-muted">Nuevo registro</small>
            </a>
          </div>

          <!-- Solo admin -->
          <div class="col-6 col-md-4 quick-admin d-none">
            <a href="/reportes.html" class="btn btn-outline-success w-100 py-3 text-start">
              <div class="fw-semibold">📊 Reportes</div>
              <small class="text-muted">Ver registros</small>
            </a>
          </div>

          <div class="col-6 col-md-4 quick-admin d-none">
            <a href="/admin-salones.html" class="btn btn-outline-secondary w-100 py-3 text-start">
              <div class="fw-semibold">🏢 Salones</div>
              <small class="text-muted">Administrar</small>
            </a>
          </div>

          <div class="col-6 col-md-4 quick-admin d-none">
            <a href="/crear_usuario.html" class="btn btn-outline-warning w-100 py-3 text-start">
              <div class="fw-semibold">👥 Usuarios</div>
              <small class="text-muted">CRUD usuarios</small>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Mensaje para usuario normal -->
    <div id="dashboardUserInfo" class="d-none mb-4"></div>
      </div>
    </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
