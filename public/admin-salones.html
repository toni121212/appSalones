<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Salones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar"></div>
  <div class="container py-5">

    <div class="card shadow-sm p-4">
      <h2 class="mb-4">Administrar salones</h2>

      <!-- Formulario para crear un nuevo salón -->
      <form id="f">
        <div class="mb-3">
          <label class="form-label">Nombre del salón</label>
          <input type="text" name="nombre" class="form-control" placeholder="Nombre del salón" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Crear salón</button>
        <p id="msg" class="mt-3"></p>
      </form>

      <hr>

      <!-- Listado de salones -->
      <h4 class="mt-4">Salones existentes</h4>
      <div id="list" class="mt-4"></div>
      
      <br>
      <a class="btn btn-secondary w-100" href="/dashboard.html">⬅ Volver</a>

    </div>
  </div>
  <script src="/js/navbar.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin-salones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
