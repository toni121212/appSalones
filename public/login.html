<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="mb-1">Eventos • Finanzas</h4>
            <p class="text-muted mb-4">Acceso al sistema</p>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input class="form-control" name="email" placeholder="Escribe tu correo" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input class="form-control" name="password" type="password" placeholder="Escribe tu contraseña" required>
              </div>

              <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>

            <div id="msg" class="alert alert-danger mt-3 d-none"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
